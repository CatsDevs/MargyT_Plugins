name: Build MargyT plugin

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/build-plugin.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get MargyT build tools
        run: git clone --depth 1 https://github.com/xzwew/MargyT.git MargyT

      - name: Add plugin to MargyT build tree
        run: |
          mkdir -p MargyT/examples/custom-background
          cp -R plugin/. MargyT/examples/custom-background/

      - name: Build .mtp
        working-directory: MargyT
        run: |
          python3 -m margyt.plugin examples/custom-background
          mkdir -p ../dist
          find examples/custom-background -maxdepth 1 -type f -name '*.mtp' -exec cp {} ../dist/ \;
          test -n "$(find ../dist -maxdepth 1 -type f -name '*.mtp' -print -quit)"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomBackgroundPlugin-mtp
          path: dist/*.mtp
          if-no-files-found: error
